<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<title>💌 הצ'אט שלנו</title>
<style>
  :root{
    --bg:#fff5f8; --card:#ffffff; --pink:#ff5c8a; --pink2:#ff8fab; --ink:#2b2030; --muted:#8c7b92;
    --me:#ffd6e3; --them:#ffffff; --line:#f3dfe6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1420; --card:#2a1e30; --ink:#f6eaf3; --muted:#a592ad; --me:#7a2a4a; --them:#3a2a42; --line:#3d2c46; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .hidden{display:none!important}

  /* כניסה */
  #login{margin:auto;width:min(92vw,380px);background:var(--card);border-radius:24px;padding:28px 22px;box-shadow:0 10px 40px rgba(255,92,138,.18);text-align:center}
  #login h1{margin:0 0 6px;font-size:28px}
  #login p{margin:0 0 18px;color:var(--muted)}
  #login input{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:10px;text-align:center}
  #login .go{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-weight:700;font-size:17px}
  #loginErr{color:#e11d48;min-height:20px;margin-top:10px;font-size:14px}

  /* אפליקציה */
  #app{flex:1;display:flex;flex-direction:column;min-height:0}
  header{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .hrow{display:flex;align-items:center;gap:10px}
  .avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:24px}
  .hname{font-weight:800;font-size:17px}
  #statusLine{font-size:14px;opacity:.95}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-inline-end:6px}
  .dot.on{background:#4ade80;box-shadow:0 0 8px #4ade80}
  #statusBar{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
  #statusBar::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:14px}
  .chip:active{transform:scale(.96)}

  #msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
  .b{max-width:78%;padding:9px 12px;border-radius:18px;line-height:1.45;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.06);white-space:pre-wrap}
  .b.me{align-self:flex-start;background:var(--me);border-bottom-right-radius:6px}
  .b.them{align-self:flex-end;background:var(--them);border-bottom-left-radius:6px}
  .b .t{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .b img{display:block;max-width:100%;border-radius:12px;margin:2px 0}
  .b.status{align-self:center;background:transparent;box-shadow:none;color:var(--muted);font-size:13px;text-align:center;max-width:92%}
  .b.status strong{color:var(--pink)}
  .big{font-size:38px;line-height:1.2}

  #bar{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
  #bar .ib{width:42px;height:42px;border-radius:50%;font-size:22px;display:grid;place-items:center;background:var(--bg)}
  #input{flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
  #send{background:linear-gradient(135deg,var(--pink),var(--pink2))!important;color:#fff;font-size:20px}

  #panel{background:var(--card);border-top:1px solid var(--line);height:260px;display:flex;flex-direction:column}
  #emojis{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));padding:8px;gap:2px}
  #emojis button{font-size:26px;padding:6px;border-radius:10px}
  #emojis button:active{background:var(--bg)}
  #gifs{flex:1;display:flex;flex-direction:column;min-height:0}
  #gifQ{margin:8px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
  #gifGrid{flex:1;overflow-y:auto;columns:3;column-gap:6px;padding:0 8px 8px}
  #gifGrid img{width:100%;margin-bottom:6px;border-radius:10px;cursor:pointer;display:block}
  #gifMsg{padding:20px;text-align:center;color:var(--muted)}

  /* טאבים + ציר זמן */
  #tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
  #tabs button{flex:1;padding:11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
  #tabs button.on{color:var(--pink);border-bottom-color:var(--pink)}
  #timeline{flex:1;overflow-y:auto;padding:14px 16px 24px}
  .tlDay{font-weight:800;color:var(--pink);margin:16px 0 8px;font-size:15px}
  .tlDay:first-child{margin-top:0}
  .tlRow{position:relative;padding:2px 22px 14px 0;margin-inline-end:6px;border-inline-end:2px solid var(--line)}
  .tlRow::before{content:"";position:absolute;inset-inline-end:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--pink2);border:2px solid var(--bg)}
  .tlRow.now::before{background:#4ade80;box-shadow:0 0 8px #4ade80}
  .tlText{font-size:16px;font-weight:600}
  .tlMeta{font-size:13px;color:var(--muted);margin-top:2px}
  .tlEmpty{text-align:center;color:var(--muted);padding:40px 0}
  .hrow .sp{flex:1}
  .hbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);font-size:18px;display:grid;place-items:center}
  /* שיחת וידאו/קול */
  #call{position:fixed;inset:0;z-index:50;background:#120b16;color:#fff;display:flex;flex-direction:column}
  #remoteV{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#120b16}
  #localV{position:absolute;top:calc(70px + env(safe-area-inset-top));inset-inline-start:14px;width:min(30vw,150px);aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.5);transform:scaleX(-1);background:#2a1e30;z-index:2}
  #localV.back{transform:none}
  .callTop{position:relative;z-index:3;text-align:center;padding:calc(16px + env(safe-area-inset-top)) 16px 30px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
  .callName{font-size:22px;font-weight:800}
  #callState{font-size:15px;opacity:.9;margin-top:4px}
  .e2e{font-size:12px;opacity:.75;margin-top:4px}
  #callAvatar{position:relative;z-index:1;margin:auto;width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink2));display:grid;place-items:center;font-size:64px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,92,138,.6)}100%{box-shadow:0 0 0 30px rgba(255,92,138,0)}}
  .callBtns{position:relative;z-index:3;margin-top:auto;display:flex;justify-content:center;gap:18px;padding:30px 16px calc(26px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .cb{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.18);font-size:26px;display:grid;place-items:center;backdrop-filter:blur(6px)}
  .cb.off{background:#fff;color:#000}
  .cb.red{background:#ef4444}
  .cb.green{background:#22c55e}
  #conn{background:#fde68a;color:#78350f;text-align:center;font-size:13px;padding:6px}
  @media (prefers-color-scheme: dark){ #conn{background:#5b4510;color:#fde68a} }
</style>
</head>
<body>

<div id="login">
  <h1>💌</h1>
  <h1>הצ'אט שלנו</h1>
  <p>רק לשנינו 🤍</p>
  <input id="nameIn" placeholder="השם שלך" autocomplete="off">
  <input id="passIn" type="password" placeholder="סיסמה" autocomplete="current-password">
  <button class="go" id="goBtn">כניסה</button>
  <div id="loginErr"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="hrow">
      <div class="avatar">🏗️</div>
      <div>
        <div class="hname" id="ownerName">ראובן</div>
        <div id="statusLine"><span class="dot" id="dot"></span><span id="statusText">עוד לא עודכן סטטוס</span></div>
      </div>
      <div class="sp"></div>
      <button class="hbtn" id="voiceBtn" aria-label="שיחה קולית" title="שיחה קולית">📞</button>
      <button class="hbtn" id="videoBtn" aria-label="שיחת וידאו" title="שיחת וידאו">📹</button>
      <button class="hbtn" id="notifBtn" aria-label="התראות" title="התראות">🔔</button>
      <button class="hbtn" id="logoutBtn" aria-label="יציאה" title="יציאה">🚪</button>
    </div>
  </header>
  <div id="conn" class="hidden">מתחבר מחדש... 🔄</div>
  <div id="tabs">
    <button id="tabChat" class="on">💬 צ'אט</button>
    <button id="tabTl">🕒 ציר זמן</button>
  </div>
  <div id="statusBar" class="hidden"></div>
  <div id="msgs"></div>
  <div id="timeline" class="hidden"></div>
  <div id="panel" class="hidden">
    <div id="emojis"></div>
    <div id="gifs" class="hidden">
      <input id="gifQ" placeholder="חיפוש גיף... 🔍">
      <div id="gifGrid"></div>
      <div id="gifMsg" class="hidden"></div>
    </div>
  </div>
  <div id="bar">
    <button class="ib" id="emojiBtn" aria-label="אימוג'י">😊</button>
    <button class="ib" id="gifBtn" aria-label="גיף">🎞️</button>
    <textarea id="input" rows="1" placeholder="כתוב הודעה..."></textarea>
    <button class="ib" id="send" aria-label="שלח">➤</button>
  </div>
</div>

<div id="call" class="hidden">
  <video id="remoteV" autoplay playsinline></video>
  <video id="localV" autoplay playsinline muted></video>
  <div class="callTop">
    <div class="callName" id="callName"></div>
    <div id="callState"></div>
    <div class="e2e">🔒 מוצפן מקצה לקצה</div>
  </div>
  <div id="callAvatar">💞</div>
  <div class="callBtns" id="inBtns">
    <button class="cb red" id="declineBtn" aria-label="דחה">✖️</button>
    <button class="cb green" id="acceptBtn" aria-label="ענה">📞</button>
  </div>
  <div class="callBtns hidden" id="activeBtns">
    <button class="cb" id="muteBtn" aria-label="השתק">🎤</button>
    <button class="cb" id="camBtn" aria-label="מצלמה">📷</button>
    <button class="cb" id="flipBtn" aria-label="החלף מצלמה">🔄</button>
    <button class="cb red" id="hangBtn" aria-label="נתק">📕</button>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
  const OWNER = (window.CHAT_CONFIG || {}).OWNER_NAME || 'ראובן';
  const enc = new TextEncoder(), dec = new TextDecoder();
  const $ = id => document.getElementById(id);
  const b64 = buf => { let s=''; const a=new Uint8Array(buf); for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = a => Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');
  const unhex = h => Uint8Array.from(h.match(/../g)||[], x => parseInt(x,16));
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

  let cfg = window.CHAT_CONFIG || {};
  let key = null, token = '', myName = '', ws = null, retry = 0, authed = false, retryTimer = null, keepAlive = null;
  const seen = new Set();
  const statuses = []; // רק של הבעלים

  async function derive(pass){
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits(
      {name:'PBKDF2', salt: enc.encode('love-chat-v1'), iterations:200000, hash:'SHA-256'}, base, 512));
  }
  // נשמר במכשיר רק המפתח הנגזר (לא הסיסמה עצמה)
  async function useBits(bits){
    key = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-GCM', false, ['encrypt','decrypt']);
    token = hex(bits.slice(32));
  }
  async function encrypt(obj){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
    return {iv: b64(iv), ct: b64(ct)};
  }
  async function decrypt(m){
    try{
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(m.iv)}, key, unb64(m.ct));
      return JSON.parse(dec.decode(pt));
    }catch(e){ return null; }
  }

  function wsUrl(){
    if(cfg.SAME_ORIGIN || !cfg.SERVER_URL) return location.origin.replace(/^http/, 'ws');
    return cfg.SERVER_URL.replace(/\/$/,'').replace(/^http/, 'ws');
  }
  // כתובת הטונל משתנה בכל הפעלה של השרת - טוענים מחדש את config.js (בלי cache) לפני ניסיון חוזר
  function reloadConfig(){
    return new Promise(res => {
      const s = document.createElement('script');
      s.src = 'config.js?t=' + Date.now();
      s.onload = s.onerror = () => { s.remove(); cfg = window.CHAT_CONFIG || cfg; res(); };
      document.head.appendChild(s);
    });
  }
  const isOpen = () => ws && (ws.readyState === 0 || ws.readyState === 1);

  function connect(){
    clearTimeout(retryTimer); retryTimer = null;
    if(isOpen()) return;
    if(!cfg.SERVER_URL && !cfg.SAME_ORIGIN){ showErr('השרת עדיין לא מוגדר (המחשב כבוי?)'); scheduleRetry(); return; }
    try{ ws = new WebSocket(wsUrl()); }catch(e){ scheduleRetry(); return; }
    const sock = ws;
    sock.onopen = () => { retry = 0; sock.send(JSON.stringify({type:'auth', token})); };
    sock.onmessage = async ev => {
      let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
      if(m.type === 'denied'){
        authed=false; sock.onclose = null; sock.close();
        if(m.reason === 'blocked'){ showLogin('יותר מדי ניסיונות. נסה שוב בעוד 10 דקות'); return; }
        store.del('lc_key'); showLogin('סיסמה שגויה'); return;
      }
      if(m.type === 'history'){
        $('conn').classList.add('hidden');
        clearInterval(keepAlive);
        keepAlive = setInterval(() => { if(sock.readyState === 1) sock.send('{"type":"ping"}'); }, 25000);
        if(!authed){ authed = true; $('login').classList.add('hidden'); $('app').classList.remove('hidden'); setup(); }
        $('msgs').innerHTML=''; seen.clear(); statuses.length = 0;
        for(const x of m.msgs) await addMsg(x, true);
        renderTimeline();
        scrollDown(true);
      } else if(m.type === 'msg'){ await addMsg(m.msg); }
      else if(m.type === 'prune'){
        document.querySelectorAll('#msgs .b').forEach(e => { if(Number(e.dataset.ts) < m.before) e.remove(); });
        while(statuses.length && statuses[0].ts < m.before) statuses.shift();
        renderStatus(); renderTimeline();
      }
      else if(m.type === 'online'){ updateDot(m.count); }
      else if(m.type === 'sig'){ const p = await decrypt(m); if(p) onSignal(p); }
    };
    sock.onclose = () => {
      clearInterval(keepAlive);
      if(authed) $('conn').classList.remove('hidden');
      else showErr('לא מצליח להתחבר לשרת. מנסה שוב... 🙏');
      updateDot(0);
      scheduleRetry();
    };
  }
  function scheduleRetry(){
    if(retryTimer || !token) return;
    retry++;
    retryTimer = setTimeout(async () => { retryTimer = null; if(retry > 1) await reloadConfig(); connect(); }, Math.min(1000*retry, 10000));
  }
  // כשחוזרים לאפליקציה בטלפון - מתחברים מיד במקום לחכות
  document.addEventListener('visibilitychange', () => { if(!document.hidden && token && !isOpen()){ retry = 0; connect(); } });
  window.addEventListener('online', () => { if(token && !isOpen()){ retry = 0; connect(); } });

  let ownerOnline = false;
  function updateDot(count){ ownerOnline = count >= 2 || (myName === OWNER && count >= 1); $('dot').classList.toggle('on', count >= 2); }

  const fmt = ts => new Date(ts).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  const fmtDay = ts => { const d=new Date(ts), n=new Date(); return d.toDateString()===n.toDateString()? '' : d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+' '; };
  const onlyEmoji = t => /^(\p{Extended_Pictographic}|‍|️|\s){1,6}$/u.test(t);

  async function addMsg(raw, quiet){
    if(seen.has(raw.id)) return; seen.add(raw.id);
    const p = await decrypt(raw); if(!p) return;
    const el = document.createElement('div');
    el.dataset.ts = raw.ts;
    if(p.kind === 'call'){
      el.className = 'b status';
      el.textContent = (p.video ? '📹 ' : '📞 ') + (p.missed ? 'שיחה שלא נענתה' : (p.video ? 'שיחת וידאו' : 'שיחה קולית') + ' · ' + dur(p.ms||0))
        + ' · ' + fmtDay(raw.ts) + fmt(raw.ts);
    } else if(p.kind === 'status'){
      el.className = 'b status';
      el.innerHTML = '';
      const s = document.createElement('span'); s.textContent = p.from + ' עדכן/ה: ';
      const st = document.createElement('strong'); st.textContent = p.text;
      const tm = document.createElement('span'); tm.textContent = ' · ' + fmtDay(raw.ts) + fmt(raw.ts);
      el.append(s, st, tm);
      if(p.from === OWNER){ statuses.push({text:p.text, ts:raw.ts}); renderStatus(); if(!quiet) renderTimeline(); }
    } else {
      const mine = p.from === myName;
      el.className = 'b ' + (mine ? 'me' : 'them');
      if(p.kind === 'gif' && /^https:\/\/[a-z0-9.-]*giphy\.com\//i.test(p.url||'')){
        const img = document.createElement('img'); img.src = p.url; img.loading = 'lazy'; img.alt = 'GIF';
        el.appendChild(img);
      } else {
        const tx = document.createElement('span'); tx.textContent = p.text || '';
        if(onlyEmoji(p.text||'')) tx.className = 'big';
        el.appendChild(tx);
      }
      const t = document.createElement('span'); t.className='t';
      t.textContent = (mine ? '' : p.from + ' · ') + fmtDay(raw.ts) + fmt(raw.ts);
      el.appendChild(t);
      if(!quiet && !mine){
        document.title = '💌 הודעה חדשה'; setTimeout(()=>document.title='💌 הצ\'אט שלנו', 4000);
        if(document.hidden && window.Notification && Notification.permission === 'granted'){
          try{ new Notification('💌 ' + p.from, { body: p.kind === 'gif' ? 'GIF 🎞️' : (p.text || ''), tag: 'love-chat' }); }catch(e){}
        }
      }
    }
    const box = $('msgs');
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
    box.appendChild(el);
    if(!quiet && (nearBottom || p.from === myName)) scrollDown();
  }
  function scrollDown(instant){ const b=$('msgs'); b.scrollTo({top:b.scrollHeight, behavior: instant?'auto':'smooth'}); }

  function dur(ms){
    const m = Math.round(ms/60000);
    if(m < 1) return 'פחות מדקה';
    if(m < 60) return m + " דק'";
    const h = Math.floor(m/60), r = m % 60;
    return h + " שע'" + (r ? ' ו-' + r + " דק'" : '');
  }
  function dayLabel(ts){
    const d = new Date(ts), n = new Date(), y = new Date(); y.setDate(n.getDate()-1);
    if(d.toDateString() === n.toDateString()) return 'היום';
    if(d.toDateString() === y.toDateString()) return 'אתמול';
    return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'});
  }
  function renderTimeline(){
    const box = $('timeline'); box.innerHTML = '';
    if(!statuses.length){ const e = document.createElement('div'); e.className='tlEmpty'; e.textContent = 'עוד אין עדכונים 🕊️'; box.appendChild(e); return; }
    let lastDay = '';
    for(let i = statuses.length-1; i >= 0; i--){
      const s = statuses[i], day = dayLabel(s.ts), isNow = i === statuses.length-1;
      if(day !== lastDay){ const h = document.createElement('div'); h.className='tlDay'; h.textContent = day; box.appendChild(h); lastDay = day; }
      const row = document.createElement('div'); row.className = 'tlRow' + (isNow ? ' now' : '');
      const tx = document.createElement('div'); tx.className='tlText'; tx.textContent = s.text;
      const mt = document.createElement('div'); mt.className='tlMeta';
      const end = isNow ? Date.now() : statuses[i+1].ts;
      mt.textContent = fmt(s.ts) + ' · ' + (isNow ? 'עכשיו, כבר ' : '') + dur(end - s.ts);
      row.append(tx, mt); box.appendChild(row);
    }
  }
  function showTab(tl){
    $('tabChat').classList.toggle('on', !tl); $('tabTl').classList.toggle('on', tl);
    $('msgs').classList.toggle('hidden', tl); $('timeline').classList.toggle('hidden', !tl);
    $('bar').classList.toggle('hidden', tl);
    if(tl){ $('panel').classList.add('hidden'); renderTimeline(); } else scrollDown(true);
  }
  $('tabChat').onclick = () => showTab(false);
  $('tabTl').onclick = () => showTab(true);
  setInterval(() => { if(!$('timeline').classList.contains('hidden')) renderTimeline(); }, 30000);

  function renderStatus(){
    const last = statuses[statuses.length-1];
    if(!last){ $('statusText').textContent = 'עוד לא עודכן סטטוס'; return; }
    $('statusText').textContent = last.text + ' · ' + fmtDay(last.ts) + fmt(last.ts);
  }

  async function sendPayload(p){
    if(!ws || ws.readyState !== 1) return;
    const e = await encrypt(Object.assign({from: myName}, p));
    ws.send(JSON.stringify({type:'msg', iv:e.iv, ct:e.ct}));
  }
  function sendText(){
    const v = $('input').value.trim(); if(!v) return;
    $('input').value=''; $('input').style.height='auto';
    sendPayload({kind:'text', text:v});
  }

  const STATUSES = ['🏗️ באתר בניה','🚗 בנסיעה','👷 בפגישה עם לקוח','💻 עובד על פרויקט','🍽️ אוכל','🏠 בבית','😴 הולך לישון','📞 עסוק בשיחה'];
  const EMOJIS = '😀 😃 😄 😁 😆 😅 😂 🤣 🥲 ☺️ 😊 😇 🙂 😉 😍 🥰 😘 😗 😙 😚 😋 😛 😜 🤪 🤗 🤭 🤔 🫠 😴 😌 😎 🤩 🥳 😏 😒 🙄 😔 😢 😭 😤 😡 🥺 😱 🤯 😳 🫶 ❤️ 🧡 💛 💚 💙 💜 🤍 💖 💗 💓 💞 💕 💘 💝 💋 🌹 🌸 🌻 🍀 ✨ ⭐ 🔥 🎉 🎁 🎂 🍕 🍔 🍟 ☕ 🍫 🍦 🥂 🍷 🐶 🐱 🦋 🌈 ☀️ 🌙 👍 👏 🙌 🙏 💪 🤝 👋 🫂 💃 🕺 🏠 🚗 ✈️ 🏖️ 💍 🏗️ 👷'.split(' ');

  let didSetup = false;
  function setup(){
    if(didSetup) return; didSetup = true;
    $('ownerName').textContent = OWNER;
    if(myName === OWNER){
      $('statusBar').classList.remove('hidden');
      const bar = $('statusBar');
      STATUSES.forEach(s => { const c=document.createElement('button'); c.className='chip'; c.textContent=s; c.onclick=()=>sendPayload({kind:'status', text:s}); bar.appendChild(c); });
      const custom = document.createElement('button'); custom.className='chip'; custom.textContent='✏️ אחר...';
      custom.onclick = () => { const v = prompt('מה אתה עושה עכשיו?'); if(v && v.trim()) sendPayload({kind:'status', text:v.trim()}); };
      bar.appendChild(custom);
    }
    const g = $('emojis');
    EMOJIS.forEach(e => { const b=document.createElement('button'); b.textContent=e; b.onclick=()=>{ const i=$('input'); i.value+=e; i.focus(); }; g.appendChild(b); });
  }

  // פאנל אימוג'י / גיפים
  function togglePanel(which){
    const panel = $('panel');
    const showing = !panel.classList.contains('hidden');
    const cur = $('gifs').classList.contains('hidden') ? 'emoji' : 'gif';
    if(showing && cur === which){ panel.classList.add('hidden'); return; }
    panel.classList.remove('hidden');
    $('emojis').classList.toggle('hidden', which==='gif');
    $('gifs').classList.toggle('hidden', which!=='gif');
    if(which==='gif') gifSearch('');
  }
  let gifTimer;
  async function gifSearch(q){
    const msg = $('gifMsg'), grid = $('gifGrid');
    if(!cfg.GIPHY_KEY){ grid.innerHTML=''; msg.classList.remove('hidden'); msg.textContent='חסר מפתח GIPHY בקובץ config.json'; return; }
    msg.classList.add('hidden');
    const url = q ? `https://api.giphy.com/v1/gifs/search?api_key=${encodeURIComponent(cfg.GIPHY_KEY)}&q=${encodeURIComponent(q)}&limit=30&rating=g&lang=he`
                  : `https://api.giphy.com/v1/gifs/trending?api_key=${encodeURIComponent(cfg.GIPHY_KEY)}&limit=30&rating=g`;
    try{
      const r = await (await fetch(url)).json();
      grid.innerHTML='';
      (r.data||[]).forEach(g => {
        const img = document.createElement('img');
        img.src = g.images.fixed_height_small.url; img.loading='lazy'; img.alt = g.title||'gif';
        img.onclick = () => { sendPayload({kind:'gif', url: g.images.fixed_height.url}); $('panel').classList.add('hidden'); };
        grid.appendChild(img);
      });
      if(!r.data || !r.data.length){ msg.classList.remove('hidden'); msg.textContent='לא נמצא כלום 🤷'; }
    }catch(e){ msg.classList.remove('hidden'); msg.textContent='שגיאה בטעינת גיפים'; }
  }

  // ===== שיחות וידאו/קול (WebRTC) =====
  // המדיה עוברת ישירות בין המכשירים ומוצפנת ב-DTLS-SRTP. ההודעות שמקימות את השיחה (SDP/ICE, כולל
  // טביעות האצבע של מפתחות ההצפנה) מוצפנות ב-AES-GCM עם מפתח הצ'אט - כך שהשרת לא יכול לקרוא אותן
  // או להתחזות לצד השני (MITM).
  const SID = hex(crypto.getRandomValues(new Uint8Array(8)));
  const ICE = () => (cfg.ICE_SERVERS && cfg.ICE_SERVERS.length) ? cfg.ICE_SERVERS
    : [{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'}];
  let call = null;

  async function sendSig(o){
    if(!ws || ws.readyState !== 1) return;
    const e = await encrypt(Object.assign({sid: SID, ts: Date.now()}, o));
    ws.send(JSON.stringify({type:'sig', iv:e.iv, ct:e.ct}));
  }
  async function getMedia(video, facing){
    return navigator.mediaDevices.getUserMedia({
      audio: {echoCancellation:true, noiseSuppression:true},
      video: video ? {facingMode: facing || 'user', width:{ideal:1280}, height:{ideal:720}} : false,
    });
  }
  function callUI(state){
    $('call').classList.remove('hidden');
    $('callName').textContent = call.peerName || 'שיחה';
    $('callState').textContent = state;
    const incoming = call.state === 'ringing';
    $('inBtns').classList.toggle('hidden', !incoming);
    $('activeBtns').classList.toggle('hidden', incoming);
    $('acceptBtn').textContent = call.video ? '📹' : '📞';
    $('camBtn').classList.toggle('hidden', !call.video);
    $('flipBtn').classList.toggle('hidden', !call.video);
    $('localV').classList.toggle('hidden', !call.video || !call.local);
    const live = call.state === 'active' && call.video;
    $('callAvatar').classList.toggle('hidden', live);
    $('remoteV').style.visibility = live ? 'visible' : 'hidden';
  }
  let ringCtx = null, ringTimer = null;
  function ring(on){
    clearInterval(ringTimer); ringTimer = null;
    if(navigator.vibrate) navigator.vibrate(on ? [400,200,400] : 0);
    if(!on) return;
    const beep = () => {
      try{
        ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
        const o = ringCtx.createOscillator(), g = ringCtx.createGain();
        o.frequency.value = 660; g.gain.value = .08; o.connect(g); g.connect(ringCtx.destination);
        o.start(); o.stop(ringCtx.currentTime + .35);
      }catch(e){}
      if(navigator.vibrate) navigator.vibrate([400,200,400]);
    };
    beep(); ringTimer = setInterval(beep, 1500);
  }

  async function startCall(video){
    if(call) return;
    if(!ws || ws.readyState !== 1){ alert('אין חיבור לשרת כרגע'); return; }
    if(!window.RTCPeerConnection || !navigator.mediaDevices){ alert('הדפדפן לא תומך בשיחות'); return; }
    let local;
    try{ local = await getMedia(video); }catch(e){ alert('אין גישה למצלמה/מיקרופון. צריך לאשר בדפדפן 🙏'); return; }
    call = {id: hex(crypto.getRandomValues(new Uint8Array(8))), state:'calling', video, local, mine:true,
            facing:'user', ice:[], peerName: myName === OWNER ? '' : OWNER};
    $('localV').srcObject = local;
    callUI('מתקשר... 📳');
    sendSig({t:'call', id: call.id, from: myName, video});
    call.timeout = setTimeout(() => { if(call && call.state === 'calling') endCall(true, 'אין מענה', true); }, 45000);
  }

  async function acceptCall(){
    if(!call || call.state !== 'ringing') return;
    ring(false);
    try{ call.local = await getMedia(call.video); }
    catch(e){ alert('אין גישה למצלמה/מיקרופון. צריך לאשר בדפדפן 🙏'); endCall(true); return; }
    $('localV').srcObject = call.local;
    call.state = 'connecting'; callUI('מתחבר... 🔐');
    makePC();
    sendSig({t:'accept', id: call.id, to: call.peer, from: myName});
  }

  function makePC(){
    const c = call;
    const pc = c.pc = new RTCPeerConnection({iceServers: ICE()});
    c.local.getTracks().forEach(t => pc.addTrack(t, c.local));
    pc.ontrack = e => { $('remoteV').srcObject = e.streams[0]; $('remoteV').play().catch(()=>{}); };
    pc.onicecandidate = e => { if(e.candidate && call === c) sendSig({t:'ice', id:c.id, to:c.peer, cand:e.candidate.toJSON()}); };
    pc.onconnectionstatechange = () => {
      if(call !== c) return;
      const st = pc.connectionState;
      if(st === 'connected'){
        if(c.state !== 'active'){ c.state = 'active'; c.started = Date.now(); }
        clearInterval(c.clock);
        const tick = () => { if(call === c) $('callState').textContent = clock(Date.now() - c.started); };
        callUI(''); tick(); c.clock = setInterval(tick, 1000);
      } else if(st === 'disconnected'){ $('callState').textContent = 'החיבור חלש... 📶'; }
      else if(st === 'failed'){ endCall(true, 'החיבור נכשל (רשת חסומה?)'); }
    };
    return pc;
  }
  const clock = ms => { const s = Math.floor(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
  async function flushIce(){ const c = call; for(const x of c.ice.splice(0)) try{ await c.pc.addIceCandidate(x); }catch(e){} }

  function endCall(notify, reason, missed){
    const c = call; if(!c) return;
    call = null;
    ring(false);
    if(notify) sendSig({t:'hangup', id:c.id, to:c.peer});
    clearTimeout(c.timeout); clearInterval(c.clock);
    if(c.local) c.local.getTracks().forEach(t => t.stop());
    if(c.pc) try{ c.pc.close(); }catch(e){}
    $('remoteV').srcObject = null; $('localV').srcObject = null;
    // רישום השיחה בצ'אט (מוצפן כמו כל הודעה) - רק מי שהתקשר רושם, כדי שלא יהיה כפול
    if(c.mine && (c.started || missed)) sendPayload({kind:'call', video:c.video, ms: c.started ? Date.now()-c.started : 0, missed: !c.started});
    if(reason){ $('callState').textContent = reason; $('inBtns').classList.add('hidden'); $('activeBtns').classList.add('hidden'); setTimeout(()=>{ if(!call) $('call').classList.add('hidden'); }, 1800); }
    else $('call').classList.add('hidden');
  }

  async function onSignal(p){
    if(p.sid === SID || Math.abs(Date.now() - (p.ts||0)) > 120000) return; // מתעלם מהודעות ישנות (replay)
    if(p.to && p.to !== SID && p.t !== 'accept') return;
    const c = call;
    switch(p.t){
      case 'call':
        if(p.from === myName) return; // טאב אחר שלי
        if(c){ sendSig({t:'busy', id:p.id, to:p.sid}); return; }
        call = {id:p.id, state:'ringing', video:!!p.video, peer:p.sid, peerName:p.from, ice:[], facing:'user'};
        callUI(p.video ? 'שיחת וידאו נכנסת 📹' : 'שיחה נכנסת 📞');
        ring(true);
        if(document.hidden && window.Notification && Notification.permission === 'granted')
          try{ new Notification('📞 ' + p.from + ' מתקשר/ת', {tag:'love-chat-call', requireInteraction:true}); }catch(e){}
        call.timeout = setTimeout(() => { if(call && call.state === 'ringing') endCall(false); }, 45000);
        return;
      case 'accept':
        if(!c || c.id !== p.id) return;
        if(c.state === 'ringing'){ endCall(false, 'נענתה במכשיר אחר'); return; }
        if(c.state !== 'calling' || p.to !== SID) return;
        clearTimeout(c.timeout);
        c.peer = p.sid; if(p.from) c.peerName = p.from; c.state = 'connecting'; callUI('מתחבר... 🔐');
        { const pc = makePC(); const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
          sendSig({t:'offer', id:c.id, to:c.peer, sdp: pc.localDescription.toJSON()}); }
        return;
      case 'offer':
        if(!c || c.id !== p.id || !c.pc) return;
        await c.pc.setRemoteDescription(p.sdp); await flushIce();
        { const ans = await c.pc.createAnswer(); await c.pc.setLocalDescription(ans);
          sendSig({t:'answer', id:c.id, to:c.peer, sdp: c.pc.localDescription.toJSON()}); }
        return;
      case 'answer':
        if(!c || c.id !== p.id || !c.pc) return;
        await c.pc.setRemoteDescription(p.sdp); await flushIce();
        return;
      case 'ice':
        if(!c || c.id !== p.id) return;
        if(c.pc && c.pc.remoteDescription) try{ await c.pc.addIceCandidate(p.cand); }catch(e){}
        else c.ice.push(p.cand);
        return;
      case 'busy': case 'decline':
        if(c && c.id === p.id && c.state === 'calling') endCall(true, p.t === 'busy' ? 'בשיחה אחרת' : 'השיחה נדחתה', true);
        return;
      case 'hangup':
        if(c && c.id === p.id) endCall(false, c.state === 'ringing' ? 'שיחה שלא נענתה' : 'השיחה הסתיימה');
        return;
    }
  }

  $('voiceBtn').onclick = () => startCall(false);
  $('videoBtn').onclick = () => startCall(true);
  $('acceptBtn').onclick = acceptCall;
  $('declineBtn').onclick = () => { if(call){ sendSig({t:'decline', id:call.id, to:call.peer}); endCall(false); } };
  $('hangBtn').onclick = () => endCall(true);
  $('muteBtn').onclick = () => {
    if(!call || !call.local) return;
    const t = call.local.getAudioTracks()[0]; if(!t) return;
    t.enabled = !t.enabled; $('muteBtn').classList.toggle('off', !t.enabled); $('muteBtn').textContent = t.enabled ? '🎤' : '🔇';
  };
  $('camBtn').onclick = () => {
    if(!call || !call.local) return;
    const t = call.local.getVideoTracks()[0]; if(!t) return;
    t.enabled = !t.enabled; $('camBtn').classList.toggle('off', !t.enabled);
  };
  $('flipBtn').onclick = async () => {
    if(!call || !call.local || !call.video) return;
    const facing = call.facing === 'user' ? 'environment' : 'user';
    try{
      const s = await navigator.mediaDevices.getUserMedia({video:{facingMode: facing}});
      const nt = s.getVideoTracks()[0], old = call.local.getVideoTracks()[0];
      const sender = call.pc && call.pc.getSenders().find(x => x.track && x.track.kind === 'video');
      if(sender) await sender.replaceTrack(nt);
      if(old){ call.local.removeTrack(old); old.stop(); }
      call.local.addTrack(nt); call.facing = facing;
      $('localV').classList.toggle('back', facing !== 'user');
    }catch(e){ alert('אין מצלמה נוספת'); }
  };
  window.addEventListener('pagehide', () => { if(call) endCall(true); });

  function showErr(t){ $('loginErr').textContent = t; }
  function showLogin(t){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); showErr(t||''); }

  async function login(){
    const name = $('nameIn').value.trim(), pass = $('passIn').value;
    if(!name || !pass){ showErr('צריך שם וסיסמה'); return; }
    showErr('מתחבר... 💞');
    myName = name;
    const bits = await derive(pass); await useBits(bits);
    $('passIn').value = '';
    store.set('lc_name', name); store.set('lc_key', hex(bits));
    retry = 0; connect();
  }
  function logout(){
    if(!confirm('לצאת? תצטרך להקליד שוב את הסיסמה')) return;
    store.del('lc_key'); store.del('lc_pass');
    location.reload();
  }

  $('goBtn').onclick = login;
  $('passIn').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
  $('send').onclick = sendText;
  $('input').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey && !('ontouchstart' in window)){ e.preventDefault(); sendText(); } });
  $('input').addEventListener('input', e => { e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'; });
  $('emojiBtn').onclick = () => togglePanel('emoji');
  $('gifBtn').onclick = () => togglePanel('gif');
  $('gifQ').addEventListener('input', e => { clearTimeout(gifTimer); gifTimer = setTimeout(()=>gifSearch(e.target.value.trim()), 400); });

  $('logoutBtn').onclick = logout;
  $('notifBtn').onclick = async () => {
    if(!window.Notification){ alert('הדפדפן לא תומך בהתראות'); return; }
    const r = await Notification.requestPermission();
    alert(r === 'granted' ? 'התראות הופעלו 🔔' : 'ההתראות חסומות בהגדרות הדפדפן');
  };
  if(!window.Notification || Notification.permission !== 'default') $('notifBtn').classList.add('hidden');

  const sn = store.get('lc_name'), sk = store.get('lc_key');
  store.del('lc_pass'); // גרסה ישנה שמרה את הסיסמה עצמה - מוחקים
  if(sn) $('nameIn').value = sn;
  if(sn && sk && sk.length === 128){
    myName = sn; showErr('מתחבר... 💞');
    useBits(unhex(sk)).then(connect);
  }
})();
</script>
</body>
