name: Deploy love-chat to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore: ['docs/config.js']
  workflow_dispatch:

concurrency:
  group: love-chat-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_TOKEN: ${{ secrets.LOVE_CHAT_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$AUTH_TOKEN" ]; then
            echo "::warning::Set the CLOUDFLARE_API_TOKEN and LOVE_CHAT_AUTH_TOKEN repository secrets to deploy (see love-chat README > Cloudflare)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
      - run: npm test
        if: steps.check.outputs.ready == 'true'
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Set AUTH_TOKEN secret
        if: steps.check.outputs.ready == 'true'
        run: printf '%s' "$AUTH_TOKEN" | npx wrangler secret put AUTH_TOKEN
